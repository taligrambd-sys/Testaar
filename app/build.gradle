apply plugin: 'com.android.application'

android {
    namespace 'com.example.audioconvertertest'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.audioconvertertest"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // audioconverter-release.aar এই আর্কিটেকচারে বিল্ড করা, তাই এবিআই ফিল্টার সেট করা হলো
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.2'

    // app/libs ফোল্ডারে রাখা audioconverter-release.aar (বা যেকোনো .jar) এখানে অটোমেটিক যুক্ত হবে
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
}
